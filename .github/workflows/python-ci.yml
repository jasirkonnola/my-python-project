
name: Python CI

on:
  push:
    branches:
      - main
      
  pull_request:
    branches:
      - main
      
  workflow_dispatch:

jobs:
  check:
    name: Check Python code
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile app.py

  test:
    name: Run Python tests
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest

  secret-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Use secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEYY }}

        run: |
          if [ -n "$API_KEY" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing"
            exit 1
          fi

