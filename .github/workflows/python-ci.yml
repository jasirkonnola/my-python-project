name: Python CI

on:
  push:
    branches:
      - main
      
  pull_request:
    branches:
      - main
      
  workflow_dispatch:

jobs:
  check:
    name: Check Python code
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt
          
      - name: Check Python syntax
        run: python -m py_compile app.py

  test:
    name: Run Python tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: check
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt
          
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests and create report
        shell: bash
        run: |
          python -m unittest -v 2>&1 | tee test-report.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-report.txt
          if-no-files-found: warn
          retention-days: 7

  secret-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Use secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Secret is available"
          else
            echo "Secret is missing (Skipping demo)"
            # Exit 0 so it doesn't fail your pipeline if the secret isn't configured yet
            exit 0
          fi
