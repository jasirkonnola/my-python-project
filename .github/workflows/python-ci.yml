name: Python CI

on:
  push:
    branches:
      - main
      
  pull_request:
    branches:
      - main
      
  workflow_dispatch:

jobs:
  check:
    name: Check Python code
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      # Removed cache from here because check doesn't run pip install
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Check Python syntax
        run: python -m py_compile app.py

      - name: Report syntax failure
        if: failure()
        run: echo "Syntax check failed on Python ${{ matrix.python-version }}"

  test:
    name: Run Python tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: check
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      # Caching is kept here because pip install runs in this job
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt
          
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests and create report
        shell: bash
        run: |
          python -m unittest -v 2>&1 | tee test-report.txt
          test "${PIPESTATUS[0]}" -eq 0

      - name: Tests passed message
        if: success()
        shell: bash
        run: echo "All tests passed on ${{ matrix.os }} / Python ${{ matrix.python-version }}"

      - name: Show report on failure
        if: failure()
        shell: bash
        run: |
          echo "Test failed. Printing report:"
          cat test-report.txt || echo "No report was created"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Finish message
        if: always()
        shell: bash
        run: echo "Test job finished."

  deploy:
    name: Deploy (demo)
    needs: [check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy message
        run: echo "Deploying from main..."
        
  secret-demo:
    name: Secret demo
    runs-on: ubuntu-latest
    env:
      API_KEY: ${{ secrets.DEMO_API_KEY }}
      
    steps:
      - name: Use secret
        if: env.API_KEY != ''
        run: echo "Secret is available"

      - name: Secret missing
        if: env.API_KEY == ''
        run: echo "Secret is missing (skipping demo)"
